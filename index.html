<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팔굽혀펴기 카운터</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#14161a;--sub:#6b7280;--accent:#ff5a1f;--ok:#16a34a;--line:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--card:#181b20;--text:#f2f3f5;--sub:#9aa1ab;--line:#2a2e35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1013;--card:#181b20;--text:#f2f3f5;--sub:#9aa1ab;--line:#2a2e35;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.count{font-size:96px;font-weight:800;line-height:1;text-align:center;color:var(--accent);transition:transform .15s}
.count.pop{transform:scale(1.15)}
.label{text-align:center;color:var(--sub);font-size:14px;margin-top:4px}
.vid{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
video{width:100%;height:100%;object-fit:cover;display:block}
.state{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:4px 10px;font-size:13px}
canvas#graph{width:100%;height:70px;display:block;margin-top:8px;border-radius:8px;background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{flex:1;min-width:90px;padding:12px;border:0;border-radius:12px;font-size:15px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:var(--line);color:var(--text)}
button:disabled{opacity:.4;cursor:default}
label{display:block;font-size:13px;color:var(--sub);margin-top:6px}
input[type=range]{width:100%}
.msg{font-size:13px;color:var(--sub);line-height:1.5}
.err{color:#dc2626}

/* 탭 */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{min-width:0}

/* 연속 일수 */
.streak{display:flex;align-items:center;gap:12px}
.flame{font-size:44px;line-height:1}
.flame.off{filter:grayscale(1);opacity:.45}
.snum{font-size:30px;font-weight:800;line-height:1.1}
.ssub{font-size:13px;color:var(--sub);margin-top:2px}
.week{display:flex;justify-content:space-between;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--sub)}
.dot{width:30px;height:30px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:15px}
.dot.on{background:var(--accent)}
.dot.today{outline:2px solid var(--accent);outline-offset:2px}
.goal{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--sub)}
.goal input{width:72px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px}

/* 휴식 타이머 */
.timer{font-size:56px;font-weight:800;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.timer.done{color:var(--ok)}

/* 주간 그래프 */
.wtitle{text-align:center;font-size:16px;font-weight:800;margin:0 0 14px}
.wchart{position:relative;height:170px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line)}
.wcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.wval{font-size:13px;font-weight:700;margin-bottom:3px;min-height:16px}
.wbar{width:100%;max-width:36px;border-radius:8px 8px 0 0;background:var(--line)}
.wbar.some{background:rgba(255,90,31,.45)}
.wbar.hit{background:var(--accent)}
.wgoal{position:absolute;left:0;right:0;border-top:2px dashed var(--sub);opacity:.6;pointer-events:none}
.wgoal span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--sub)}
.wlabels{display:flex;gap:8px;margin-top:6px}
.wlabels div{flex:1;text-align:center;font-size:12px;color:var(--sub)}
.wlabels div.today{color:var(--accent);font-weight:800}
.stats{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<main>
<h1>💪 팔굽혀펴기 카운터</h1>

<div class="tabs">
<button id="tabWorkout">운동</button>
<button class="sec" id="tabWeek">주간 기록</button>
</div>

<!-- ===== 운동 화면 ===== -->
<section id="pageWorkout">

<div class="card">
<div class="streak">
<div class="flame off" id="flame">🔥</div>
<div>
<div class="snum"><span id="streakNum">0</span>일 연속</div>
<div class="ssub" id="streakSub">오늘 0/10회</div>
</div>
</div>
<div class="week" id="week"></div>
<div class="goal"><span>하루 목표</span><input type="number" id="goal" min="1" max="500" value="10" inputmode="numeric"><span>회</span></div>
</div>

<div class="card">
<div class="count" id="count">0</div>
<div class="label">오늘 팔굽혀펴기 횟수</div>
</div>

<div class="card">
<div class="vid"><video id="video" playsinline muted autoplay></video><div class="state" id="state">카메라 꺼짐</div></div>
<canvas id="graph" width="520" height="70"></canvas>
<div class="row">
<button id="start">카메라 시작</button>
<button class="sec" id="flip">전후면 전환</button>
</div>
<div class="row">
<button class="sec" id="minus">-1</button>
<button class="sec" id="plus">+1</button>
<button class="sec" id="reset">초기화</button>
</div>
<label>민감도 (낮을수록 작은 움직임도 인식): <b id="sensVal">6</b>
<input type="range" id="sens" min="2" max="14" value="6"></label>
<p class="msg" id="msg">카메라를 바닥에 두고 몸의 옆모습이 보이게 세워 주세요. 시작 후 1~2초 가만히 있다가 운동하면 더 잘 인식돼요. 영상은 기기 밖으로 전송되지 않아요.</p>
</div>

<div class="card">
<div class="timer" id="timer">0:00</div>
<div class="label">세트 사이 휴식 타이머</div>
<div class="row">
<button class="sec" data-sec="30">30초</button>
<button class="sec" data-sec="60">60초</button>
<button class="sec" data-sec="90">90초</button>
<button class="sec" data-sec="120">2분</button>
</div>
<div class="row"><button class="sec" id="tstop">타이머 정지</button></div>
</div>

</section>

<!-- ===== 주간 기록 화면 ===== -->
<section id="pageWeek" hidden>
<div class="card">
<p class="wtitle" id="wTitle"></p>
<div class="wchart" id="wChart"></div>
<div class="wlabels" id="wLabels"></div>
<div class="stats">
<div class="stat"><b id="wTotal">0</b><span>이번 주 합계</span></div>
<div class="stat"><b id="wAvg">0</b><span>하루 평균</span></div>
<div class="stat"><b id="wHit">0/7</b><span>목표 달성</span></div>
</div>
<p class="msg" id="wMsg" style="text-align:center;margin-top:12px"></p>
<div class="row">
<button class="sec" id="wPrev">◀ 지난주</button>
<button class="sec" id="wNow">이번 주</button>
<button class="sec" id="wNext">다음주 ▶</button>
</div>
</div>
</section>
</main>

<script>
(function(){
var video=document.getElementById('video'),stateEl=document.getElementById('state'),
countEl=document.getElementById('count'),msg=document.getElementById('msg'),
graph=document.getElementById('graph'),gctx=graph.getContext('2d'),
sens=document.getElementById('sens'),sensVal=document.getElementById('sensVal');
var count=0,facing='user',stream=null,running=false,audioCtx=null;
var W=96,H=72,cv=document.createElement('canvas');cv.width=W;cv.height=H;
var cx=cv.getContext('2d',{willReadFrequently:true});
var prev=null,pos=0,phase='up',lastRep=0,hist=[],settle=0;

/* ---------- 기록 저장 (브라우저 localStorage) ---------- */
var KEY='pushup_streak_v1';
var data={goal:10,days:{}};
try{
  var raw=localStorage.getItem(KEY);
  if(raw){
    var p=JSON.parse(raw);
    if(p&&typeof p==='object'){
      data.goal=(p.goal>0&&p.goal<=500)?p.goal:10;
      data.days=(p.days&&typeof p.days==='object')?p.days:{};
    }
  }
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function dkey(d){
  var m=d.getMonth()+1,dd=d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;
}
var todayKey=dkey(new Date());
count=(data.days[todayKey]||{n:0}).n||0;

/* ---------- 연속 일수 ---------- */
var flameEl=document.getElementById('flame'),streakNumEl=document.getElementById('streakNum'),
streakSubEl=document.getElementById('streakSub'),weekEl=document.getElementById('week'),
goalEl=document.getElementById('goal');
goalEl.value=data.goal;

function streakNum(){
  var n=0,d=new Date(),r=data.days[dkey(d)];
  // 오늘 아직 목표를 못 채웠으면 어제부터 셈 (하루가 끝나기 전까지는 연속이 안 끊겨요)
  if(!(r&&r.done))d.setDate(d.getDate()-1);
  while(true){
    r=data.days[dkey(d)];
    if(r&&r.done){n++;d.setDate(d.getDate()-1)}else break;
  }
  return n;
}
function renderStreak(){
  var n=streakNum(),today=data.days[todayKey],doneToday=!!(today&&today.done);
  streakNumEl.textContent=n;
  flameEl.classList.toggle('off',n===0);
  if(doneToday)streakSubEl.textContent='오늘 목표 달성! 🎉 ('+count+'회)';
  else if(n>0)streakSubEl.textContent='오늘 '+count+'/'+data.goal+'회 · 오늘 채우면 '+(n+1)+'일째';
  else streakSubEl.textContent='오늘 '+count+'/'+data.goal+'회 · 목표를 채우고 불을 켜세요';
  var names=['일','월','화','수','목','금','토'];
  weekEl.textContent='';
  for(var i=6;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    var k=dkey(d),r=data.days[k],wd=document.createElement('div'),dot=document.createElement('div'),nm=document.createElement('div');
    wd.className='wd';
    dot.className='dot'+(r&&r.done?' on':'')+(i===0?' today':'');
    dot.textContent=(r&&r.done)?'🔥':'';
    nm.textContent=names[d.getDay()];
    wd.appendChild(dot);wd.appendChild(nm);weekEl.appendChild(wd);
  }
  renderWeek();
}
function rollover(){
  var k=dkey(new Date());
  if(k!==todayKey){
    todayKey=k;
    count=(data.days[k]||{n:0}).n||0;
    countEl.textContent=count;
    renderStreak();
  }
}
goalEl.onchange=function(){
  var g=Math.round(+goalEl.value);
  if(!(g>0))g=10;
  if(g>500)g=500;
  data.goal=g;goalEl.value=g;
  var r=data.days[todayKey];
  if(r&&r.n>=g)r.done=true;
  save();renderStreak();
};
document.addEventListener('visibilitychange',function(){if(!document.hidden)rollover()});
setInterval(rollover,60000);

/* ---------- 탭 전환 ---------- */
var pageWorkout=document.getElementById('pageWorkout'),pageWeek=document.getElementById('pageWeek'),
tabWorkout=document.getElementById('tabWorkout'),tabWeek=document.getElementById('tabWeek');
function showPage(which){
  var w=which==='week';
  pageWorkout.hidden=w;pageWeek.hidden=!w;
  tabWorkout.classList.toggle('sec',w);
  tabWeek.classList.toggle('sec',!w);
  if(w){weekOffset=0;renderWeek()}
  window.scrollTo(0,0);
}
tabWorkout.onclick=function(){showPage('workout')};
tabWeek.onclick=function(){showPage('week')};

/* ---------- 주간 그래프 (월~일) ---------- */
var weekOffset=0;
var wTitle=document.getElementById('wTitle'),wChart=document.getElementById('wChart'),
wLabels=document.getElementById('wLabels'),wTotal=document.getElementById('wTotal'),
wAvg=document.getElementById('wAvg'),wHit=document.getElementById('wHit'),
wMsg=document.getElementById('wMsg'),wNext=document.getElementById('wNext');
var BAR_MAX=130;

function weekStart(off){
  var d=new Date();
  d.setDate(d.getDate()-((d.getDay()+6)%7)-7*off); // 그 주의 월요일
  return d;
}
function md(d){return (d.getMonth()+1)+'월 '+d.getDate()+'일'}

function renderWeek(){
  if(pageWeek.hidden)return;
  var start=weekStart(weekOffset),end=new Date(start);
  end.setDate(start.getDate()+6);
  var names=['월','화','수','목','금','토','일'],tk=dkey(new Date());
  var vals=[],total=0,hits=0,maxN=0,i;
  for(i=0;i<7;i++){
    var d=new Date(start);d.setDate(start.getDate()+i);
    var k=dkey(d),r=data.days[k],n=r?(r.n||0):0;
    vals.push({n:n,done:!!(r&&r.done),today:k===tk,label:names[i]});
    total+=n;if(r&&r.done)hits++;if(n>maxN)maxN=n;
  }
  var maxV=Math.max(data.goal,maxN,1),scale=BAR_MAX/maxV;

  wTitle.textContent=(weekOffset===0?'이번 주 ':'')+md(start)+' ~ '+md(end);
  wChart.textContent='';wLabels.textContent='';

  var gl=document.createElement('div'),gs=document.createElement('span');
  gl.className='wgoal';gl.style.bottom=Math.round(data.goal*scale)+'px';
  gs.textContent='목표 '+data.goal;gl.appendChild(gs);wChart.appendChild(gl);

  for(i=0;i<7;i++){
    var v=vals[i],col=document.createElement('div'),val=document.createElement('div'),bar=document.createElement('div'),lb=document.createElement('div');
    col.className='wcol';
    val.className='wval';val.textContent=v.n>0?v.n:'';
    bar.className='wbar'+(v.done?' hit':(v.n>0?' some':''));
    bar.style.height=(v.n>0?Math.max(6,Math.round(v.n*scale)):3)+'px';
    col.appendChild(val);col.appendChild(bar);wChart.appendChild(col);
    lb.textContent=v.label;if(v.today)lb.className='today';
    wLabels.appendChild(lb);
  }

  wTotal.textContent=total;
  wAvg.textContent=(Math.round(total/7*10)/10);
  wHit.textContent=hits+'/7';
  wMsg.textContent=total===0?'이 주에는 기록이 없어요.':'';
  wNext.disabled=(weekOffset===0);
}
document.getElementById('wPrev').onclick=function(){weekOffset++;renderWeek()};
document.getElementById('wNext').onclick=function(){if(weekOffset>0){weekOffset--;renderWeek()}};
document.getElementById('wNow').onclick=function(){weekOffset=0;renderWeek()};

/* ---------- 소리/진동 ---------- */
function unlockAudio(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
}
function beep(freq){
  try{
    unlockAudio();
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=freq||880;g.gain.value=.15;o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+.1);
  }catch(e){}
}
function setCount(n){
  rollover();
  count=Math.max(0,n);countEl.textContent=count;
  var r=data.days[todayKey]||(data.days[todayKey]={n:0,done:false});
  r.n=count;
  if(count>=data.goal)r.done=true;
  save();renderStreak();
  countEl.classList.add('pop');setTimeout(function(){countEl.classList.remove('pop')},150);
}
function rep(){setCount(count+1);beep();if(navigator.vibrate){try{navigator.vibrate(40)}catch(e){}}}

sens.oninput=function(){sensVal.textContent=sens.value};
document.getElementById('plus').onclick=function(){setCount(count+1)};
document.getElementById('minus').onclick=function(){setCount(count-1)};
document.getElementById('reset').onclick=function(){
  if(count>0&&!confirm('오늘 기록을 0으로 초기화할까요?'))return;
  setCount(0);
  var r=data.days[todayKey];if(r){r.done=false}
  save();renderStreak();
  pos=0;phase='up';
};

/* ---------- 휴식 타이머 ---------- */
var timerEl=document.getElementById('timer'),tEnd=0,tInt=null;
function fmt(s){var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r}
function stopTimer(){clearInterval(tInt);tInt=null}
function tick(){
  var left=Math.ceil((tEnd-Date.now())/1000);
  if(left<=0){
    stopTimer();
    timerEl.textContent='휴식 끝!';timerEl.classList.add('done');
    beep(1040);setTimeout(function(){beep(1040)},250);setTimeout(function(){beep(1040)},500);
    if(navigator.vibrate){try{navigator.vibrate([200,100,200])}catch(e){}}
    return;
  }
  timerEl.textContent=fmt(left);
}
function startTimer(sec){
  unlockAudio();stopTimer();
  timerEl.classList.remove('done');
  tEnd=Date.now()+sec*1000;
  tick();tInt=setInterval(tick,200);
}
var tbtns=document.querySelectorAll('button[data-sec]');
for(var i=0;i<tbtns.length;i++){
  tbtns[i].onclick=(function(b){return function(){startTimer(+b.getAttribute('data-sec'))}})(tbtns[i]);
}
document.getElementById('tstop').onclick=function(){
  stopTimer();timerEl.classList.remove('done');timerEl.textContent='0:00';
};

/* ---------- 카메라 ---------- */
async function startCam(){
  unlockAudio();
  if(stream){stream.getTracks().forEach(function(t){t.stop()})}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=stream;await video.play();
    prev=null;pos=0;phase='up';settle=20;
    if(!running){running=true;requestAnimationFrame(loop)}
    stateEl.textContent='준비 중...';
    msg.classList.remove('err');
  }catch(e){
    msg.classList.add('err');
    msg.textContent='카메라를 켤 수 없어요. 브라우저 주소창의 카메라 권한을 허용했는지 확인해 주세요. (그동안은 +1 버튼으로 세어도 돼요)';
    stateEl.textContent='카메라 꺼짐';
  }
}
document.getElementById('start').onclick=startCam;
document.getElementById('flip').onclick=function(){facing=facing==='user'?'environment':'user';if(stream)startCam()};

function loop(){
  requestAnimationFrame(loop);
  if(!stream||video.readyState<2)return;
  cx.drawImage(video,0,0,W,H);
  var d=cx.getImageData(0,0,W,H).data,cur=new Float32Array(W*H);
  for(var i=0;i<W*H;i++){cur[i]=(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11)}
  if(prev){
    // 세로 방향 광학 흐름(Lucas-Kanade 1D): 아래로 움직이면 +, 위로 움직이면 -
    var num=0,den=0;
    for(var y=1;y<H-1;y++){
      for(var x=0;x<W;x++){
        var k=y*W+x,it=cur[k]-prev[k];
        if(it>6||it<-6){
          var iy=(cur[k+W]-cur[k-W])/2;
          num+=it*iy;den+=iy*iy;
        }
      }
    }
    var vy=den>200?-num/den:0;
    if(vy>3)vy=3;if(vy<-3)vy=-3;
    pos=pos*0.96+vy*6;
    track();
  }
  prev=cur;
  drawGraph();
}
function track(){
  if(settle>0){settle--;stateEl.textContent='준비 중...';return}
  var T=+sens.value*1.5,now=performance.now();
  if(phase==='up'&&pos>T){phase='down'}
  else if(phase==='down'&&pos<-T*0.4&&now-lastRep>600){phase='up';lastRep=now;rep()}
  stateEl.textContent=phase==='down'?'⬇ 내려가는 중':'⬆ 올라온 상태';
}
function drawGraph(){
  hist.push(pos);if(hist.length>130)hist.shift();
  var w=graph.width,h=graph.height,T=+sens.value*1.5;
  gctx.clearRect(0,0,w,h);
  gctx.strokeStyle='rgba(128,128,128,.4)';gctx.beginPath();
  gctx.moveTo(0,h/2);gctx.lineTo(w,h/2);gctx.stroke();
  gctx.strokeStyle='#ff5a1f';gctx.lineWidth=2;gctx.beginPath();
  for(var i=0;i<hist.length;i++){
    var x=i/130*w,y=h/2-Math.max(-h/2+2,Math.min(h/2-2,hist[i]/(T*2)*h/2));
    i?gctx.lineTo(x,y):gctx.moveTo(x,y);
  }
  gctx.stroke();
}

/* 첫 화면 표시 */
countEl.textContent=count;
renderStreak();
})();
</script>
